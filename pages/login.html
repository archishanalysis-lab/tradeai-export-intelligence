<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - TradeAI</title>

    <meta
      name="description"
      content="Login to TradeAI and access AI-powered export import intelligence dashboard."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- CSS -->

    <link rel="stylesheet" href="../css/main.css?v=replit-style" />

    <link rel="stylesheet" href="../css/dashboard.css?v=replit-style" />

    <link rel="stylesheet" href="../css/responsive.css?v=replit-style" />

    <!-- GOOGLE FONT -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>

  <body class="auth-page">
    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">
      <div class="container nav-container">
        <!-- LOGO -->

        <a href="../index.html" class="public-brand" aria-label="TradeAI Home">
          <span class="public-brand-mark" aria-hidden="true">T</span>
          <span>TradeAI</span>
        </a>

        <!-- NAVIGATION -->

        <nav class="nav" aria-label="Main Navigation">
          <a href="../index.html" data-i18n="home"> Home </a>

          <a href="../index.html#features" data-i18n="features"> Features </a>

          <a href="pricing.html" data-i18n="pricing"> Pricing </a>

          <a href="contact.html" data-i18n="contact"> Contact </a>
        </nav>

        <!-- ACTIONS -->

        <div class="auth-buttons">
          <button
            id="themeToggle"
            class="theme-btn"
            type="button"
            aria-label="Toggle dark mode"
          >
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>

          <a href="register.html" class="cta" data-i18n="register">Register</a>
        </div>

        <!-- MOBILE BUTTON -->

        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-label="Open mobile menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- =====================================================
         MOBILE MENU
    ====================================================== -->

    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <a href="../index.html" data-i18n="home"> Home </a>

      <a href="../index.html#features" data-i18n="features"> Features </a>

      <a href="pricing.html" data-i18n="pricing"> Pricing </a>

      <a href="contact.html" data-i18n="contact"> Contact </a>

      <a href="register.html" data-i18n="register"> Register </a>
    </div>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="auth-page-main">
      <section class="auth-container">
        <div class="auth-center">
          <h2 data-i18n="login">Login</h2>

          <p class="auth-subtitle" data-i18n="loginSubtitle">Continue to your dashboard</p>

          <!-- FORM -->

          <form id="loginForm" class="auth-form" method="post" autocomplete="on">
            <!-- EMAIL -->

            <div class="input-group">
              <label for="loginEmail" data-i18n="emailAddress"> Email Address </label>

              <input
                type="email"
                id="loginEmail"
                name="email"
                autocomplete="email"
                inputmode="email"
                placeholder="Enter your email"
                data-i18n-placeholder="emailPlaceholder"
                required
              />
            </div>

            <!-- PASSWORD -->

            <div class="input-group">
              <label for="loginPassword" data-i18n="password"> Password </label>

              <input
                type="password"
                id="loginPassword"
                name="password"
                autocomplete="current-password"
                placeholder="Enter password"
                data-i18n-placeholder="passwordPlaceholder"
                required
              />

              <button
                type="button"
                class="toggle-password"
                aria-label="Show password"
                data-i18n-aria="showPassword"
                aria-controls="loginPassword"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>

            <!-- OPTIONS -->

            <div class="auth-options">
              <label class="remember-me">
                <input type="checkbox" name="remember" />

                <span data-i18n="rememberMe"> Remember Me </span>
              </label>

              <a href="forgot-password.html" class="forgot-link" data-i18n="forgotPassword">
                Forgot Password?
              </a>
            </div>

            <!-- BUTTON -->

            <button type="submit" class="primary-btn auth-btn" data-i18n="loginToDashboard">
              Login To Dashboard
            </button>
          </form>

          <!-- DIVIDER -->

          <div class="auth-divider">
            <span data-i18n="or"> OR </span>
          </div>

          <!-- SOCIAL -->

          <div class="social-login">
            <button class="social-btn" type="button">
              <i class="fa-brands fa-google" aria-hidden="true"></i>

              <span data-i18n="continueWithGoogle">Continue With Google</span>
            </button>

            <button class="social-btn" type="button">
              <i class="fa-brands fa-linkedin" aria-hidden="true"></i>

              <span data-i18n="continueWithLinkedIn">Continue With LinkedIn</span>
            </button>
          </div>

          <!-- FOOTER -->

          <div class="auth-footer">
            <p>
              <span data-i18n="dontHaveAccount">Don't have an account?</span>

              <a href="register.html" data-i18n="createAccount"> Create Account </a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">
      <div class="container">
        <div class="footer-grid">
          <div>
            <h3>Company</h3>

            <a href="about.html"> About </a>

            <a href="contact.html"> Contact </a>
          </div>

          <div>
            <h3>Product</h3>

            <a href="pricing.html"> Pricing </a>

            <a href="../index.html#features"> Features </a>
          </div>
        </div>

        <p class="copyright">© 2026 TradeAI. All rights reserved.</p>
      </div>
    </footer>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->
    <script src="../js/storage.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/theme.js" defer></script>
    <script src="../js/i18n.js" defer></script>
  </body>
</html>
