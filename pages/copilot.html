<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeAI Copilot</title>
    <meta
      name="description"
      content="Ask TradeAI Copilot for export market recommendations, buyer discovery prompts, HS code guidance and trade next actions."
    />
    <link rel="stylesheet" href="../css/main.css?v=2026-05-24" />
    <link rel="stylesheet" href="../css/dashboard.css?v=2026-05-24" />
    <link rel="stylesheet" href="../css/responsive.css?v=2026-05-24" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous"
      referrerpolicy="no-referrer"
      onerror="console.error('Font Awesome failed to load on Copilot page')"
    />
  </head>
  <body class="dashboard-page">
    <header class="header">
      <div class="container nav-container">
        <a href="../index.html" class="logo">TradeAI</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="product-dashboard.html">Products</a>
          <a href="inquiry-dashboard.html">Inquiries</a>
          <a href="analytics-dashboard.html">Analytics</a>
          <a href="copilot.html" class="active">Copilot</a>
        </nav>
        <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle theme">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-label="Open mobile menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <a href="product-dashboard.html">Products</a>
      <a href="inquiry-dashboard.html">Inquiries</a>
      <a href="analytics-dashboard.html">Analytics</a>
      <a href="copilot.html">Copilot</a>
    </div>
    <main class="dashboard-main no-sidebar">
      <div class="container">
        <section class="dashboard-hero">
          <div>
            <h1>AI Trade Copilot</h1>
            <p>Ask trade questions and get guided next actions.</p>
          </div>
        </section>
        <section class="dashboard-panel">
          <form class="settings-form" id="copilotForm">
            <div class="input-group">
              <label for="copilotPrompt">Prompt</label>
              <textarea
                id="copilotPrompt"
                name="prompt"
                rows="5"
                maxlength="600"
                required
                aria-describedby="copilotPromptHint"
                placeholder="Find textile buyers in Germany"
              ></textarea>
              <p class="table-subtext" id="copilotPromptHint">
                Try: Find UAE buyers for spices, suggest best export market for turmeric, or recommend an HS code.
              </p>
            </div>
            <button class="primary" type="submit" id="copilotSubmit">
              <span class="button-label">Ask Copilot</span>
              <span class="button-spinner" aria-hidden="true"></span>
            </button>
          </form>
        </section>
        <section
          id="copilotResponse"
          class="activity-grid"
          aria-live="polite"
          aria-busy="false"
        ></section>
      </div>
    </main>
    <script src="../js/storage.js" defer onerror="console.error('Failed to load storage.js')"></script>
    <script src="../js/authGuard.js" defer></script>
    <script src="../js/state/authState.js" defer onerror="console.error('Failed to load authState.js')"></script>
    <script src="../js/state/appState.js" defer onerror="console.error('Failed to load appState.js')"></script>
    <script src="../js/state/notificationState.js" defer onerror="console.error('Failed to load notificationState.js')"></script>
    <script src="../js/api.js" defer onerror="console.error('Failed to load api.js')"></script>
    <script src="../js/auth.js" defer onerror="console.error('Failed to load auth.js')"></script>
    <script src="../js/navbar.js" defer onerror="console.error('Failed to load navbar.js')"></script>
    <script src="../js/theme.js" defer onerror="console.error('Failed to load theme.js')"></script>
    <script src="../js/copilot.js" defer onerror="console.error('Failed to load copilot.js')"></script>
    <script src="../js/i18n.js" defer></script>
  </body>
</html>
